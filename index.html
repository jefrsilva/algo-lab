<html lang="pt-BR">

    <title>Algo-Lab</title>
    <script>
      // aplica o tema salvo antes do primeiro paint (ver src/app/theme.js)

      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/canvas.css" />

    <link rel="stylesheet" href="/src/styles/codeEditor.css" />
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
